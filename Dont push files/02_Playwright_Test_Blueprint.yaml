# ============================================================
# CoinBuddy E2E Test Blueprint — Playwright
# Feed each block to codegen AI individually or as full matrix
# ============================================================

DATA_INTEGRITY:
  - id: DI-01
    desc: Reconcile wizard on an Asset generates correct signed BALANCE_ADJUSTMENT and updates ledger balance.
    assert:
      - click: '[data-testid="reconcile-btn"]'
      - fill: 'input[type=number]' -> actualValue
      - assert_text: '[data-testid=reconcile-summary]' contains "Increase ledger by" | "Decrease ledger by"
      - click: 'button:has-text("Save adjustment")'
      - assert_dom: transaction row with category '#balance-adjustment' appended to Activity list
      - assert_text: '[data-testid=account-balance]' == actualValue

  - id: DI-02
    desc: Reconcile wizard on Liability inverts direction (actual < cached => debt decrease transfer).
    assert:
      - open ReconcileWizard for liability account
      - enter actual < account.balance
      - assert generated tx: toAccountId == account.id (SIGN_RULES.to.liability = -1)

  - id: DI-03
    desc: Manual backup executes full pipeline (generate -> encrypt -> upload -> metadata).
    assert:
      - click: '[data-testid="create-backup-btn"]'
      - fill backup password modal
      - assert_network: no plaintext JSON in outgoing blob (must be AES payload w/ salt/iv/ciphertext keys)
      - assert_dom: '[data-testid=last-backup-status]' text == "UP_TO_DATE"
      - assert_dom: '[data-testid=backup-history-list] li' count increments by 1

  - id: DI-04
    desc: Auto-backup respects Wi-Fi-only setting when offline.
    assert:
      - context.setOffline(true)
      - enable isWifiOnly=true, trigger scheduled backup
      - assert_dom: sync status == "PENDING_NETWORK"
      - assert: no upload network call fired

  - id: DI-05
    desc: Restore flow round-trips data exactly (accounts/tx count match pre-backup snapshot).
    assert:
      - capture accounts.length, transactions.length before backup
      - create backup, wipe local storage (clearAppBrowserStorage)
      - restore from generated file with correct password
      - assert_dom: '[data-testid=account-list] .account-row' count == captured accounts.length
      - assert_dom: '[data-testid=activity-list] .tx-row' count == captured transactions.length

  - id: DI-06
    desc: Restore with wrong password fails gracefully, no partial hydration.
    assert:
      - upload valid .enc file, enter wrong password
      - assert_text: '[data-testid=restore-pwd-error]' contains "Invalid Password"
      - assert: localStorage/db state unchanged (pre/post snapshot equal)

  - id: DI-07
    desc: Local backup retention prunes to 5 newest files.
    assert:
      - create 7 sequential local backups
      - open backup history list
      - assert_dom: '[data-testid=backup-history-list] li' count == 5
      - assert: oldest 2 filenames absent from DOM

  - id: DI-08 [KNOWN BUG — expected to fail]
    desc: Google Drive retention should delete old remote files beyond N — verifies confirmed no-op bug (uploadBackup returns early for GOOGLE_DRIVE, no delete endpoint exists under api/google-drive/).
    assert:
      - mock 7 files in /api/google-drive/backups response
      - trigger backup #8 via GOOGLE_DRIVE provider
      - assert_network: DELETE call to Drive API fired for oldest file
      - (currently expected to FAIL)

  - id: DI-09
    desc: Legacy unencrypted backup import surfaces an explicit warning before hydrating (confirmed decryptBackup silently trusts legacy plaintext today).
    assert:
      - upload plaintext JSON with accounts/transactions keys, no password
      - assert_dom: '[data-testid=legacy-backup-warning]' visible before restore proceeds

  - id: DI-10
    desc: validateLedgerImport should only need to run once per restore (regression guard for duplicate-validation redundancy).
    assert:
      - spy/instrument validateLedgerImport call count via page.exposeFunction hook or network/log tap
      - trigger full restore
      - assert: call count == 1

DOMAIN_GUARDRAILS:
  - id: DG-01
    desc: Cash-subtype asset expense blocked below zero floor.
    assert:
      - select Cash account, enter expense amount > balance
      - click Save
      - assert_text: '[data-testid=tx-error]' contains "Insufficient funds"
      - assert: no new row in Activity list

  - id: DG-02
    desc: Bank overdraft allows negative balance down to -overdraft_limit only.
    assert:
      - set overdraft_limit = 5000, balance = 1000
      - submit expense of 5500
      - assert: transaction succeeds, balance == -4500
      - submit further expense of 600
      - assert_text: error "cannot drop below its overdraft limit"

  - id: DG-03
    desc: Credit Card (Revolving) expense blocked from exceeding credit_limit.
    assert:
      - CC balance=9000, limit=10000
      - submit expense 1500
      - assert_text: '[data-testid=tx-error]' contains "Credit limit exceeded"
      - assert: CC balance unchanged at 9000

  - id: DG-04
    desc: Term Loan (soft ceiling) permits balance to exceed original principal via late fee expense.
    assert:
      - loan balance == principal (600000)
      - add EXPENSE type=liability tx of 5000 (late fee)
      - assert: balance == 605000, no blocking error
      - assert_dom: '[data-testid=over-principal-badge]' visible, progress bar fill capped at 100% with warning-red class

  - id: DG-05 [KNOWN BUG — expected to fail]
    desc: Credit Card limit cannot be edited below current outstanding balance (confirmed missing in updateCreditCard()).
    assert:
      - CC balance=8000
      - open Edit Credit Card modal (AddAccountModal, liabilityType=Credit Card, editingCreditCard set)
      - set limit=5000, submit
      - assert_text: error "Credit limit cannot be lower than the current outstanding balance"
      - (currently expected to FAIL)

  - id: DG-06
    desc: OPENING_BALANCE and BALANCE_ADJUSTMENT rows have Edit/Delete fully disabled.
    assert:
      - locate row with data-tx-type="OPENING_BALANCE"
      - assert: '[data-testid=edit-tx-btn]' disabled=true
      - assert: '[data-testid=delete-tx-btn]' disabled=true
      - repeat for BALANCE_ADJUSTMENT row

  - id: DG-07
    desc: Category with transaction history soft-deletes (is_archived=1), stays in historical charts.
    assert:
      - delete category with existing tx
      - assert_dom: category absent from '[data-testid=category-dropdown] option'
      - navigate Insights -> assert historical bar for that category still renders

  - id: DG-08
    desc: monthCycleDay clamps to last day of shorter month.
    assert:
      - set monthCycleDay=31
      - navigate to February cycle view
      - assert_network/db query: cycle boundary date == last day of Feb (28 or 29)

  - id: DG-09
    desc: Account with non-zero balance cannot be hard-deleted; only archived at zero balance.
    assert:
      - attempt delete on account balance != 0
      - assert_text: block/error shown, account still in list
      - zero out balance via reconcile, retry delete
      - assert: account row removed, is_archived flips true in export

UI_UX_STATE:
  - id: UX-01 [KNOWN BUG — expected to fail]
    desc: Privacy Mode toggle masks all monetary values app-wide from a persistent header control (confirmed today it is Dashboard-only and hides just 3 hero metrics).
    assert:
      - locate '[data-testid=privacy-toggle]' in Header (not Dashboard hero card)
      - click toggle
      - assert_text: every '.font-numeric, [data-testid*=balance]' element on Dashboard, Activity, Cards, and Insights renders "••••••"
      - navigate across routes, assert masking persists globally
      - (currently expected to FAIL — toggle only exists inside Dashboard.tsx and only masks Net Worth/Total Assets/Total Liabilities)

  - id: UX-02
    desc: Toast Undo delays SQL DELETE for 5s and reverts on Undo click.
    assert:
      - delete a transaction row
      - assert_dom: row hidden immediately, '[data-testid=undo-toast]' visible
      - click Undo within 5s
      - assert: row reappears, no DB DELETE fired (assert via query count unchanged)
      - repeat without clicking Undo -> after 5s assert DB row count decremented

  - id: UX-03
    desc: Bulk selection Live Math Engine computes correct net for mixed transaction types.
    assert:
      - long-press to enter selection mode
      - select 1 income (+500), 1 expense (-200), 1 transfer (300)
      - assert_text: '[data-testid=selection-net-sum]' matches documented net formula
      - assert: transfer counted as absolute add, not netted against income/expense

  - id: UX-04
    desc: Filter/search state persists across navigation via back button.
    assert:
      - apply Type Pill + Category filter + search text on Activity page
      - tap a transaction row to open Edit modal, then back button
      - assert: same filters/search text still applied (DOM state, not reset)

  - id: UX-05
    desc: Sankey chart renders Income -> Expense/Transfer flows excluding MARKET_ADJUSTMENT/BALANCE_ADJUSTMENT.
    assert:
      - seed ledger with MARKET_ADJUSTMENT tx
      - open Insights Cash Flow Sankey
      - assert_dom: no node/link references adjustment category
      - assert: total flow sum excludes adjustment amount

  - id: UX-06
    desc: Backup Warning Banner appears on silent sync failure (revoked OAuth).
    assert:
      - mock authExpired=true, trigger executeSilentBackup
      - assert_dom: '[data-testid=backup-warning-banner]' visible with red styling
      - assert: local push notification event 'coinbuddy_backup_alert' dispatched (listen via page.evaluate)

  - id: UX-07
    desc: Progressive disclosure — Add/Edit Transaction form hides fields by type.
    assert:
      - select type=Expense -> assert '[data-testid=to-account-field]' not visible
      - select type=Transfer -> assert '[data-testid=category-field]' not visible
