name: Apply CoinBuddy recurring fixes

on:
  push:
    branches:
      - fix/event-insights-multi-select
    paths:
      - scripts/apply_coinbuddy_fixes.py
      - .github/workflows/apply-coinbuddy-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Correct staging-script expression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_coinbuddy_fixes.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    ...context.accountNames ?? [],', '    ...(context.accountNames ?? []),')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply recurring and Activity fixes
        run: python3 scripts/apply_coinbuddy_fixes.py

      - name: Update async addTransaction callers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/ReconcileWizard.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  const submit = () => {', '  const submit = async () => {', 1)
          text = text.replace('    const result = addTransaction({', '    const result = await addTransaction({', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Make offline backup test deterministic in Node
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/__tests__/backupManager.test.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('      // Mock navigator.onLine = false if defined')
          end = text.index('      const result = await BackupManager.executeSilentBackup(mockSettings);', start)
          replacement = "      // Vitest runs in Node where navigator may not exist at all.\n      vi.stubGlobal('navigator', { onLine: false });\n\n"
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix recurring transactions and Activity amount search"
          git push origin HEAD:fix/event-insights-multi-select
