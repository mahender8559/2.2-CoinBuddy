name: Final Verify V3.5 Product

on:
  push:
    branches:
      - feature/v3.5-ui-refresh

concurrency:
  group: coinbuddy-v35-final-product
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  final-v35-product:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.5-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Full desktop and mobile browser regression
        run: npm run test:e2e
      - name: Remove temporary V3.5 migration scaffolding
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm -r scripts
          git commit -m "chore: remove V3.5 development scaffolding [skip ci]"
          git push origin HEAD:feature/v3.5-ui-refresh
