name: Finalize V3.5 Release

on:
  push:
    branches:
      - feature/v3.5-ui-refresh

concurrency:
  group: coinbuddy-v35-release-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize-v35:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.5-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set V3.5 package metadata
        run: npm version 3.5.0 --no-git-tag-version
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Full desktop and mobile browser regression
        run: npm run test:e2e
      - name: Commit V3.5 release metadata
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: set CoinBuddy version to 3.5.0 [skip ci]"
          git push origin HEAD:feature/v3.5-ui-refresh
