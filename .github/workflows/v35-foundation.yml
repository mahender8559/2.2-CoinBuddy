name: Verify V3.5 UI

on:
  push:
    branches:
      - feature/v3.5-ui-refresh

concurrency:
  group: coinbuddy-v35-ui-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  v35-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.5-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize migrated responsive tests
        run: python scripts/fix_v35_foundation.py
      - name: Refine mobile shell and Dashboard fidelity
        run: python scripts/refine_v35_dashboard.py
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full desktop and mobile browser regression
        run: npm run test:e2e
      - name: Upload V3.5 dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v35-dashboard-refined-screenshots
          path: test-results/**/v35-dashboard.png
          if-no-files-found: warn
      - name: Commit verified V3.5 mobile fidelity refinement
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/App.tsx src/components/Header.tsx src/components/Navigation.tsx src/components/Dashboard.tsx e2e/v35-shell.spec.ts e2e/ui-smoke.spec.ts e2e/affordability-phase7.spec.ts e2e/demo-data-v33.spec.ts e2e/v33-planning-reliability.spec.ts e2e/v34-shared-finances.spec.ts
          git diff --cached --quiet || git commit -m "refine: align v3.5 mobile dashboard with locked UI [skip ci]"
          git push origin HEAD:feature/v3.5-ui-refresh
