name: Verify V3.5 UI

on:
  push:
    branches:
      - feature/v3.5-ui-refresh

concurrency:
  group: coinbuddy-v35-ui-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  v35-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.5-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize migrated responsive tests
        run: python scripts/fix_v35_foundation.py
      - name: Preserve mobile shell and Dashboard fidelity
        run: python scripts/refine_v35_dashboard.py
      - name: Preserve V3.5 Activity redesign
        run: python scripts/apply_v35_activity.py
      - name: Preserve V3.5 Activity density
        run: python scripts/refine_v35_activity.py
      - name: Adapt Activity regressions
        run: python scripts/fix_v35_activity_tests.py
      - name: Apply V3.5 Sharing redesign
        run: python scripts/apply_v35_sharing.py
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full desktop and mobile browser regression
        run: npm run test:e2e
      - name: Upload V3.5 screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v35-dashboard-activity-sharing-screenshots
          path: |
            test-results/**/v35-dashboard.png
            test-results/**/v35-activity.png
            test-results/**/v35-sharing.png
          if-no-files-found: warn
      - name: Commit verified V3.5 Sharing milestone
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/components/SharingPanel.tsx e2e/v35-sharing.spec.ts e2e/v35-activity.spec.ts e2e/cross-page-clutter.spec.ts e2e/v35-shell.spec.ts e2e/ui-smoke.spec.ts e2e/affordability-phase7.spec.ts e2e/demo-data-v33.spec.ts e2e/v33-planning-reliability.spec.ts e2e/v34-shared-finances.spec.ts
          git diff --cached --quiet || git commit -m "feat: redesign CoinBuddy v3.5 Sharing [skip ci]"
          git push origin HEAD:feature/v3.5-ui-refresh
