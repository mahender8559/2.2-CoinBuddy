name: Verify V3.5 UI

on:
  push:
    branches:
      - feature/v3.5-ui-refresh

concurrency:
  group: coinbuddy-v35-ui-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  v35-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.5-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize migrated responsive tests
        run: python scripts/fix_v35_foundation.py
      - name: Preserve mobile shell and Dashboard fidelity
        run: python scripts/refine_v35_dashboard.py
      - name: Preserve V3.5 Activity redesign
        run: python scripts/apply_v35_activity.py
      - name: Preserve V3.5 Activity density
        run: python scripts/refine_v35_activity.py
      - name: Adapt Activity regressions
        run: python scripts/fix_v35_activity_tests.py
      - name: Apply V3.5 Sharing redesign
        run: python scripts/apply_v35_sharing.py
      - name: Preserve V3.5 Accounts and Goals redesign
        run: |
          if test -f src/components/V35AccountsPanel.tsx && test -f src/components/V35GoalsPanel.tsx && grep -q "<V35AccountsPanel" src/components/ManageFinances.tsx && grep -q "<V35GoalsPanel" src/components/ManageFinances.tsx; then
            echo 'V3.5 Accounts and Goals already committed; skipping migration.'
          else
            python scripts/apply_v35_accounts_goals.py
          fi
      - name: Preserve V3.5 Insights and Settings redesign
        run: |
          if grep -q 'Settings & Manage ⚙️' src/components/Settings.tsx && grep -q 'advanced-insights-content' src/components/Insights.tsx; then
            echo 'V3.5 Insights and Settings already committed; skipping migration.'
          else
            python scripts/apply_v35_insights_settings.py
          fi
      - name: Adapt legacy Insights regressions
        run: python scripts/fix_v35_insights_tests.py
      - name: Preserve V3.5 Categories and Transaction Details
        run: |
          if test -f src/components/V35CategoriesPanel.tsx && test -f src/components/V35TransactionDetail.tsx && grep -q "V35TransactionDetail" src/components/Activity.tsx && grep -q "<V35CategoriesPanel" src/components/ManageFinances.tsx; then
            echo 'V3.5 Categories and Transaction Details already committed; skipping migration.'
          else
            python scripts/apply_v35_categories_transaction_details.py
          fi
      - name: Apply V3.5 forms and modal system
        run: python scripts/apply_v35_forms_modals.py
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Full desktop and mobile browser regression
        run: npm run test:e2e
      - name: Upload V3.5 screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v35-ui-milestone-screenshots
          path: |
            test-results/**/v35-dashboard.png
            test-results/**/v35-activity.png
            test-results/**/v35-sharing.png
            test-results/**/v35-accounts.png
            test-results/**/v35-goals.png
            test-results/**/v35-insights.png
            test-results/**/v35-settings.png
            test-results/**/v35-categories.png
            test-results/**/v35-transaction-detail.png
            test-results/**/v35-transaction-form.png
            test-results/**/v35-account-form.png
            test-results/**/v35-pay-down.png
            test-results/**/v35-wallet-summary.png
          if-no-files-found: warn
      - name: Commit verified V3.5 forms and modal system
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/components/ui/V35ModalFrame.tsx src/components/AddTransactionModal.tsx src/components/AddAccountModal.tsx src/components/PayCardModal.tsx src/components/ReconcileWizard.tsx src/components/UpdateLoanRateModal.tsx src/components/WalletSummaryModal.tsx e2e/v35-forms-modals.spec.ts
          git diff --cached --quiet || git commit -m "feat: unify CoinBuddy v3.5 money forms and modals [skip ci]"
          git push origin HEAD:feature/v3.5-ui-refresh
