name: Apply and verify V3.5 foundation

on:
  push:
    branches:
      - feature/v3.5-ui-refresh

concurrency:
  group: coinbuddy-v35-ui-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  v35-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.5-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply V3.5 foundation
        run: python scripts/apply_v35_foundation.py
      - name: Normalize generated source
        run: python scripts/fix_v35_foundation.py
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npx playwright test e2e/v35-shell.spec.ts e2e/ui-smoke.spec.ts e2e/v34-shared-finances.spec.ts
      - name: Commit verified V3.5 foundation
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/main.tsx src/v35.css src/App.tsx src/components/Header.tsx src/components/Navigation.tsx src/components/ManageFinances.tsx src/components/ButtonTourOverlay.tsx src/components/ui/V35.tsx e2e/v35-shell.spec.ts e2e/affordability-phase7.spec.ts e2e/demo-data-v33.spec.ts e2e/v33-planning-reliability.spec.ts e2e/v34-shared-finances.spec.ts
          git diff --cached --quiet || git commit -m "feat: establish CoinBuddy v3.5 app shell [skip ci]"
          git push origin HEAD:feature/v3.5-ui-refresh
