name: Verify currency projection mobile

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - ci/run-currency-projection-mobile.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source changes
        run: |
          python3 scripts/apply_currency_input_and_projection_fix.py
          python3 scripts/fix_currency_projection_followup.py

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - name: Audit remaining numeric inputs
        shell: bash
        run: |
          echo 'Remaining type=number fields (should be non-money such as rate/day/tenure):'
          grep -R -n -C 2 'type="number"' src/components --include='*.tsx' || true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src e2e/affordability-phase7.spec.ts
          if git diff --cached --quiet; then
            echo "No verified source changes to commit"
            exit 0
          fi
          git commit -m "Fix mobile affordability and currency-aware money inputs"
          git push origin HEAD:feature/affordability-planner
