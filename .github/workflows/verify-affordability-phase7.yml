name: Verify affordability phase 7

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - .phase7-verify-trigger

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Phase 7
        run: |
          python3 scripts/apply_affordability_phase7.py
          python3 scripts/apply_affordability_phase7_testfix.py
          python3 scripts/apply_affordability_phase7_a11yfix.py
          python3 scripts/apply_affordability_phase7_settings_a11yfix.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript check
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Playwright desktop and mobile
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Print compact Playwright failure context
        if: steps.e2e.outcome == 'failure'
        shell: bash
        run: find test-results -name error-context.md -print -exec sh -c 'echo "-----"; cat "$1"; echo' _ {} \; || true
      - name: Upload compact Playwright failure evidence
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: affordability-phase7-playwright-failure-compact
          path: |
            **/error-context.md
            **/test-failed-1.png
          if-no-files-found: ignore
      - name: Fail when Playwright fails
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - name: Commit verified Phase 7 source and tests
        if: steps.e2e.outcome == 'success'
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/db/dbClient.ts src/context/AppContext.tsx src/components/Dashboard.tsx src/components/Settings.tsx src/domain/affordability.phase7.integration.test.ts src/__tests__/affordabilityBackupPhase7.test.ts e2e/affordability-phase7.spec.ts e2e/ui-smoke.spec.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Harden affordability planner end to end"
          git push origin HEAD:feature/affordability-planner
