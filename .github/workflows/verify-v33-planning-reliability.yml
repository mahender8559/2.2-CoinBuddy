name: Verify v3.3 Planning and Reliability

on:
  push:
    branches:
      - feature/v3.3-planning-reliability
    paths:
      - ci/run-v33-planning-reliability.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.3-planning-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v3.3 implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_v33_planning_reliability.py')
          s = p.read_text()
          s = s.replace("marker = '      <Header onLogout={handleLogout} showLogout={authConfigured} />'", "marker = '      <Header onLogout={handleGoogleLogout} showLogout={GOOGLE_LOGIN_ENABLED} />'")
          s = s.replace("needle = '''  const buildTimeFormatted = typeof __BUILD_TIME__ !== 'undefined' '''", "needle = \"  const buildTimeFormatted = typeof __BUILD_TIME__ !== 'undefined'\\n\"")
          s = s.replace("  const buildTimeFormatted = typeof __BUILD_TIME__ !== 'undefined' '''", "  const buildTimeFormatted = typeof __BUILD_TIME__ !== 'undefined'\n'''", 1)
          p.write_text(s)
          PY
          python3 scripts/apply_v33_planning_reliability.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('e2e/v33-planning-reliability.spec.ts')
          s = p.read_text()
          old = "  await expect(page.getByText('V33 Goal', { exact: true })).toBeVisible();\n\n  await page.getByRole('button', { name: /add transaction/i }).first().click();"
          new = "  await expect(page.getByText('V33 Goal', { exact: true })).toBeVisible();\n\n  await openTab(page, 'Dashboard');\n  await page.getByRole('button', { name: /add transaction/i }).first().click();"
          if old not in s:
              raise SystemExit('v3.3 Goal E2E navigation anchor not found')
          s = s.replace(old, new, 1)
          old_assert = "  await expect(page.getByText('V33 Goal', { exact: true }).locator('..').locator('..')).toContainText(/1,000/);"
          new_assert = "  await expect(page.getByRole('article', { name: 'Goal V33 Goal' })).toContainText(/1,000/);"
          if old_assert not in s:
              raise SystemExit('v3.3 Goal E2E assertion anchor not found')
          p.write_text(s.replace(old_assert, new_assert, 1))

          p = Path('src/components/GoalsPanel.tsx')
          s = p.read_text()
          old_card = '<div key={goal.id} className="rounded-2xl border border-outline-variant/30 bg-surface-container-low p-5">'
          new_card = '<article key={goal.id} aria-label={`Goal ${goal.name}`} className="rounded-2xl border border-outline-variant/30 bg-surface-container-low p-5">'
          if old_card not in s:
              raise SystemExit('GoalsPanel card anchor not found')
          s = s.replace(old_card, new_card, 1)
          old_close = '              {goal.protectLinkedBalance && linked && <div className="mt-3 flex items-start gap-2 rounded-xl bg-primary/8 px-3 py-2 text-xs text-on-surface-variant"><ShieldCheck className="mt-0.5 h-4 w-4 shrink-0 text-primary" /><span>The current liquid balance of this linked account is protected as a cash reserve when applicable.</span></div>}\n            </div>;'
          new_close = '              {goal.protectLinkedBalance && linked && <div className="mt-3 flex items-start gap-2 rounded-xl bg-primary/8 px-3 py-2 text-xs text-on-surface-variant"><ShieldCheck className="mt-0.5 h-4 w-4 shrink-0 text-primary" /><span>The current liquid balance of this linked account is protected as a cash reserve when applicable.</span></div>}\n            </article>;'
          if old_close not in s:
              raise SystemExit('GoalsPanel card close anchor not found')
          p.write_text(s.replace(old_close, new_close, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production and PWA build
        run: npm run build
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Commit verified v3.3 product changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add package.json package-lock.json src e2e
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Add v3.3 planning and reliability"
          git push origin HEAD:feature/v3.3-planning-reliability
