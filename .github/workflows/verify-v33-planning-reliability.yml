name: Verify v3.3 Planning and Reliability

on:
  push:
    branches:
      - feature/v3.3-planning-reliability
    paths:
      - ci/run-v33-planning-reliability.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.3-planning-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v3.3 implementation
        shell: bash
        run: |
          sed -i "s/marker = '      <Header onLogout={handleLogout} showLogout={authConfigured} \/>'/marker = '      <Header onLogout={handleGoogleLogout} showLogout={GOOGLE_LOGIN_ENABLED} \/>'/" scripts/apply_v33_planning_reliability.py
          python3 scripts/apply_v33_planning_reliability.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production and PWA build
        run: npm run build
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Commit verified v3.3 product changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add package.json package-lock.json src e2e
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Add v3.3 planning and reliability"
          git push origin HEAD:feature/v3.3-planning-reliability
