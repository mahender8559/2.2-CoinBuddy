name: Bump CoinBuddy version

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - .github/workflows/bump-coinbuddy-version.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump package version
        run: npm version 3.1.0 --no-git-tag-version

      - name: Update visible Settings version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Settings.tsx')
          text = path.read_text()
          old = '<span>Installed Build Version Date: <strong className="font-numeric text-on-surface">{buildTimeFormatted}</strong></span>'
          new = '<span>CoinBuddy <strong className="font-numeric text-on-surface">v3.1</strong> • Build <strong className="font-numeric text-on-surface">{buildTimeFormatted}</strong></span>'
          if old not in text:
              raise SystemExit('Expected Settings version label was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: TypeScript check
        run: npm run lint

      - name: Commit version bump
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add package.json package-lock.json src/components/Settings.tsx
          git commit -m "chore: bump CoinBuddy to v3.1"
          git push origin HEAD:feature/affordability-planner
