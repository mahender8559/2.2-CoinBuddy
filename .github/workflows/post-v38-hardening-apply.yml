name: Apply post-v3.8 hardening patches

on:
  push:
    branches:
      - fix/post-v38-quality-hardening
    paths:
      - scripts/apply-post-v38-hardening.mjs
      - .github/workflows/post-v38-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-v38-quality-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source transformations
        run: node scripts/apply-post-v38-hardening.mjs
      - name: Sync optional QA dependencies
        run: |
          if [ -f .hardening-install-deps ]; then
            npm install --package-lock-only --ignore-scripts --save-dev @axe-core/playwright@4.12.1 fake-indexeddb@6.2.5
            rm .hardening-install-deps
          fi
      - name: Commit applied hardening changes
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply post-v3.8 quality hardening"
          git push origin HEAD:fix/post-v38-quality-hardening

# Temporary branch-only workflow. Remove before handing the branch back for local QA.
