name: Apply cycle and event UX fixes

on:
  push:
    branches:
      - fix/event-insights-multi-select

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, found {count}')
              file_path.write_text(content.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, found {count}: {pattern[:80]}')
              file_path.write_text(updated)

          Path('src/utils/cycles.ts').write_text(dedent('''
            export type CycleDetails = {
              month: number;
              year: number;
              key: string;
            };

            export type CycleRange = {
              start: Date;
              end: Date;
            };

            const normalizeCycleDay = (monthCycleDay: number) =>
              Math.min(31, Math.max(1, Math.trunc(Number(monthCycleDay) || 1)));

            const clampDayToMonth = (year: number, month: number, day: number) =>
              Math.min(day, new Date(year, month + 1, 0).getDate());

            export function shiftCycle(year: number, month: number, offset: number): { year: number; month: number } {
              const shifted = new Date(year, month + offset, 1);
              return { year: shifted.getFullYear(), month: shifted.getMonth() };
            }

            export function getCycleDetailsForDay(dateString: string, monthCycleDay: number): CycleDetails {
              const txDate = new Date(dateString);
              let year = txDate.getFullYear();
              let month = txDate.getMonth();
              const configuredDay = normalizeCycleDay(monthCycleDay);
              const effectiveDay = clampDayToMonth(year, month, configuredDay);

              if (configuredDay > 1 && txDate.getDate() >= effectiveDay) {
                const nextCycle = shiftCycle(year, month, 1);
                year = nextCycle.year;
                month = nextCycle.month;
              }

              return { month, year, key: `${year}-${month}` };
            }

            export function getCycleRange(year: number, month: number, monthCycleDay: number): CycleRange {
              const configuredDay = normalizeCycleDay(monthCycleDay);

              if (configuredDay === 1) {
                return {
                  start: new Date(year, month, 1, 0, 0, 0, 0),
                  end: new Date(year, month + 1, 0, 23, 59, 59, 999),
                };
              }

              const previousCycle = shiftCycle(year, month, -1);
              const startDay = clampDayToMonth(previousCycle.year, previousCycle.month, configuredDay);
              const nextCycleStartDay = clampDayToMonth(year, month, configuredDay);
              const start = new Date(previousCycle.year, previousCycle.month, startDay, 0, 0, 0, 0);
              const nextCycleStart = new Date(year, month, nextCycleStartDay, 0, 0, 0, 0);

              return { start, end: new Date(nextCycleStart.getTime() - 1) };
            }
          ''').lstrip())

          Path('src/utils/cycles.test.ts').write_text(dedent('''
            import { describe, expect, it } from 'vitest';
            import { getCycleDetailsForDay, getCycleRange } from './cycles';

            describe('cycle date helpers', () => {
              it('moves dates on the configured day into the next cycle', () => {
                expect(getCycleDetailsForDay('2026-08-24T12:00:00', 25).key).toBe('2026-7');
                expect(getCycleDetailsForDay('2026-08-25T12:00:00', 25).key).toBe('2026-8');
              });

              it('returns the configured start and end dates for a cycle', () => {
                const range = getCycleRange(2026, 8, 25);
                expect([range.start.getFullYear(), range.start.getMonth(), range.start.getDate()]).toEqual([2026, 7, 25]);
                expect([range.end.getFullYear(), range.end.getMonth(), range.end.getDate()]).toEqual([2026, 8, 24]);
              });

              it('clamps a cycle day to shorter months', () => {
                const range = getCycleRange(2026, 2, 31);
                expect([range.start.getFullYear(), range.start.getMonth(), range.start.getDate()]).toEqual([2026, 1, 28]);
                expect([range.end.getFullYear(), range.end.getMonth(), range.end.getDate()]).toEqual([2026, 2, 30]);
              });

              it('uses calendar months when the cycle starts on day one', () => {
                const range = getCycleRange(2026, 7, 1);
                expect([range.start.getMonth(), range.start.getDate()]).toEqual([7, 1]);
                expect([range.end.getMonth(), range.end.getDate()]).toEqual([7, 31]);
              });
            });
          ''').lstrip())

          replace_once(
              'src/context/AppContext.tsx',
              "import { hashPasscode, verifyPasscode as verifyPasscodeHash } from '../utils/passcode';\n",
              "import { hashPasscode, verifyPasscode as verifyPasscodeHash } from '../utils/passcode';\nimport { getCycleDetailsForDay } from '../utils/cycles';\n",
          )
          regex_once(
              'src/context/AppContext.tsx',
              r"  const getCycleDetails = \(dateString: string\) => \{.*?\n  \};\n\n  const isDateInCurrentCycle",
              "  const getCycleDetails = (dateString: string) => getCycleDetailsForDay(dateString, monthCycleDay);\n\n  const isDateInCurrentCycle",
          )

          replace_once(
              'src/components/Insights.tsx',
              "import { buildSankeySplitLabel } from '../utils/sankeyLabels';\n",
              "import { buildSankeySplitLabel } from '../utils/sankeyLabels';\nimport { recomputeAllAccountBalances } from '../utils/balanceManager';\nimport { getCycleRange, shiftCycle } from '../utils/cycles';\n",
          )
          replace_once('src/components/Insights.tsx', "    netWorth,\n", "    monthCycleDay,\n")
          regex_once(
              'src/components/Insights.tsx',
              r"  // Net Worth monthly trends\n  const monthlyTrends = useMemo\(\(\) => \{.*?\n  \}, \[transactions, formatCurrency, getCycleDetails, netWorth\]\);\n",
              dedent('''
                // Net Worth at each configured cycle cutoff. Replaying the ledger
                // keeps opening balances and adjustments out of cycles where they did not exist.
                const monthlyTrends = useMemo(() => {
                  const now = new Date();
                  const currentCycle = getCycleDetails(now.toISOString());
                  const verifiedTransactions = transactions.filter(transaction => transaction.is_verified !== 0);
                  const historicalNetWorth: Array<{
                    key: string;
                    m: string;
                    cycleLabel: string;
                    netWorth: number;
                    netFlow: number;
                    isCurrent: boolean;
                  }> = [];

                  for (let offset = 5; offset >= 0; offset--) {
                    const cycle = shiftCycle(currentCycle.year, currentCycle.month, -offset);
                    const key = `${cycle.year}-${cycle.month}`;
                    const { start, end } = getCycleRange(cycle.year, cycle.month, monthCycleDay);
                    const isCurrent = key === currentCycle.key;
                    const cutoff = isCurrent ? now : end;
                    const cutoffTime = cutoff.getTime();
                    const startTime = start.getTime();

                    const transactionsAtCutoff = verifiedTransactions.filter(transaction => {
                      const transactionTime = new Date(transaction.date).getTime();
                      return Number.isFinite(transactionTime) && transactionTime <= cutoffTime;
                    });
                    const projectedAccounts = recomputeAllAccountBalances(accounts, transactionsAtCutoff);
                    const cycleNetWorth = projectedAccounts
                      .filter(account => !account.is_archived)
                      .reduce((total, account) => total + (account.type === 'asset' ? account.balance : -account.balance), 0);
                    const cycleNetFlow = verifiedTransactions.reduce((total, transaction) => {
                      const transactionTime = new Date(transaction.date).getTime();
                      if (!Number.isFinite(transactionTime) || transactionTime < startTime || transactionTime > cutoffTime || !isCashFlowTransaction(transaction)) return total;
                      if (transaction.type === 'income') return total + Math.abs(transaction.amount);
                      if (transaction.type === 'expense') return total - Math.abs(transaction.amount);
                      return total;
                    }, 0);

                    historicalNetWorth.push({
                      key,
                      m: new Date(cycle.year, cycle.month, 1).toLocaleString('default', { month: 'short' }),
                      cycleLabel: `${start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${cutoff.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`,
                      netWorth: cycleNetWorth,
                      netFlow: cycleNetFlow,
                      isCurrent,
                    });
                  }

                  const minNw = Math.min(...historicalNetWorth.map(item => item.netWorth), 0);
                  const maxNw = Math.max(...historicalNetWorth.map(item => item.netWorth), 1);
                  const range = maxNw - minNw || 1;

                  return historicalNetWorth.map(item => ({
                    m: item.m,
                    cycleLabel: item.cycleLabel,
                    h: `${Math.max(5, Math.round(((item.netWorth - minNw) / range) * 100))}%`,
                    v: formatCurrency(item.netWorth),
                    rawTotal: item.netWorth,
                    a: item.isCurrent,
                    netFlow: item.netFlow,
                  }));
                }, [transactions, accounts, formatCurrency, getCycleDetails, monthCycleDay]);
              ''').lstrip(),
          )
          replace_once(
              'src/components/Insights.tsx',
              '                    <span className="font-bold text-primary-container text-sm">{d.v}</span>\n',
              '                    <span className="font-bold text-primary-container text-sm">{d.v}</span>\n                    <span className="text-[9px] opacity-70 mt-0.5">{d.cycleLabel}</span>\n',
          )

          replace_once(
              'src/components/Activity.tsx',
              "import { useState, useMemo } from 'react';\nimport type { ComponentType, SVGProps } from 'react';\n",
              "import { useState, useMemo, useRef } from 'react';\nimport type { ComponentType, SVGProps, PointerEvent as ReactPointerEvent } from 'react';\n",
          )
          replace_once(
              'src/components/Activity.tsx',
              "  const [selectedIds, setSelectedIds] = useState<Set<string>>(new Set());\n",
              "  const [selectedIds, setSelectedIds] = useState<Set<string>>(new Set());\n  const [isEventPickerOpen, setEventPickerOpen] = useState(false);\n  const [eventName, setEventName] = useState('');\n",
          )
          regex_once(
              'src/components/Activity.tsx',
              r"  const groupSelectedToEvent = \(\) => \{.*?\n  \};\n\n",
              dedent('''
                const openEventPicker = () => {
                  if (!selectedIds.size) return;
                  setEventName('');
                  setEventPickerOpen(true);
                };

                const groupSelectedToEvent = () => {
                  const name = eventName.trim();
                  if (!selectedIds.size || !name) return;
                  const event = events.find(item => item.name.localeCompare(name, undefined, { sensitivity: 'accent' }) === 0) ?? createEvent(name);
                  groupTransactionsToEvent([...selectedIds], event.id);
                  setSelectedIds(new Set());
                  setIsSelectionMode(false);
                  setEventPickerOpen(false);
                  setEventName('');
                };

              ''').lstrip(),
          )
          replace_once(
              'src/components/Activity.tsx',
              '                  onToggleSelect={() => toggleSelection(tx.id)}\n',
              dedent('''
                                  onToggleSelect={() => toggleSelection(tx.id)}
                                  onLongPress={() => {
                                    setSelectedIds(previous => new Set(previous).add(tx.id));
                                    setIsSelectionMode(true);
                                  }}
              ''').lstrip(),
          )
          replace_once('src/components/Activity.tsx', '              onClick={groupSelectedToEvent}\n', '              onClick={openEventPicker}\n')

          selection_toolbar = '      {isSelectionMode && (\n        <div className="fixed top-20 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[400px] bg-surface-container-highest rounded-2xl p-4 shadow-2xl z-50 flex items-center justify-between border border-outline-variant/30">\n'
          event_modal = dedent('''
                  {isEventPickerOpen && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 p-4" onClick={() => setEventPickerOpen(false)}>
                      <div role="dialog" aria-modal="true" aria-labelledby="event-picker-title" className="w-full max-w-md rounded-3xl border border-outline-variant/30 bg-surface-container-highest p-5 shadow-2xl" onClick={event => event.stopPropagation()}>
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <h3 id="event-picker-title" className="text-lg font-bold text-on-surface">Assign an event</h3>
                            <p className="mt-1 text-xs text-on-surface-variant">Choose an existing event or type a new event name.</p>
                          </div>
                          <button type="button" aria-label="Close event picker" onClick={() => setEventPickerOpen(false)} className="rounded-full p-2 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface">
                            <X className="h-5 w-5" />
                          </button>
                        </div>
                        <label className="mt-5 block text-xs font-bold uppercase tracking-wider text-on-surface-variant">Existing events</label>
                        <select
                          aria-label="Choose existing event"
                          value={events.find(item => item.name.localeCompare(eventName.trim(), undefined, { sensitivity: 'accent' }) === 0)?.id ?? ''}
                          onChange={event => setEventName(events.find(item => item.id === event.target.value)?.name ?? '')}
                          className="mt-2 w-full rounded-xl border border-outline-variant/30 bg-surface-container-low px-4 py-3 text-sm text-on-surface outline-none focus:border-primary/60"
                        >
                          <option value="">{events.length ? 'Choose an event' : 'No existing events yet'}</option>
                          {events.map(event => <option key={event.id} value={event.id}>{event.name}</option>)}
                        </select>
                        <label className="mt-4 block text-xs font-bold uppercase tracking-wider text-on-surface-variant">Event name</label>
                        <input
                          autoFocus
                          value={eventName}
                          onChange={event => setEventName(event.target.value)}
                          onKeyDown={event => { if (event.key === 'Enter') groupSelectedToEvent(); }}
                          placeholder="e.g. Goa trip, Birthday dinner"
                          className="mt-2 w-full rounded-xl border border-outline-variant/30 bg-surface-container-low px-4 py-3 text-sm text-on-surface outline-none focus:border-primary/60"
                        />
                        <div className="mt-5 flex justify-end gap-3">
                          <button type="button" onClick={() => setEventPickerOpen(false)} className="rounded-xl px-4 py-2 text-sm font-semibold text-on-surface-variant hover:bg-surface-variant">Cancel</button>
                          <button type="button" disabled={!eventName.trim()} onClick={groupSelectedToEvent} className="rounded-xl bg-primary px-4 py-2 text-sm font-bold text-on-primary disabled:opacity-50">Assign event</button>
                        </div>
                      </div>
                    </div>
                  )}

          ''').lstrip()
          replace_once('src/components/Activity.tsx', selection_toolbar, event_modal + selection_toolbar)
          replace_once(
              'src/components/Activity.tsx',
              "  onToggleSelect: () => void;\n  tourId?: string;\n",
              "  onToggleSelect: () => void;\n  onLongPress: () => void;\n  tourId?: string;\n",
          )
          replace_once(
              'src/components/Activity.tsx',
              'function TransactionRow({ icon: Icon, title, subtitle, amount, tag, color, isIncome = false, isTransfer = false, isPending = false, type, onDelete, onEdit, isSelectionMode, isSelected, onToggleSelect, tourId }: TransactionRowProps) {\n',
              'function TransactionRow({ icon: Icon, title, subtitle, amount, tag, color, isIncome = false, isTransfer = false, isPending = false, type, onDelete, onEdit, isSelectionMode, isSelected, onToggleSelect, onLongPress, tourId }: TransactionRowProps) {\n',
          )
          regex_once(
              'src/components/Activity.tsx',
              r"  const c = colorMap\[color\] \|\| colorMap\.primary;\n\n  return \(\n    <div \n      data-tour-id=\{tourId\}\n      onClick=\{\(\) => \{\n        if \(isSelectionMode\) onToggleSelect\(\);\n        else if \(onEdit\) onEdit\(\);\n      \}\}\n",
              dedent('''
                const c = colorMap[color] || colorMap.primary;
                const longPressTimer = useRef<number | null>(null);
                const pointerStart = useRef<{ x: number; y: number } | null>(null);
                const suppressNextClick = useRef(false);

                const clearLongPress = () => {
                  if (longPressTimer.current !== null) {
                    window.clearTimeout(longPressTimer.current);
                    longPressTimer.current = null;
                  }
                };

                const handlePointerDown = (event: ReactPointerEvent<HTMLDivElement>) => {
                  if (isSelectionMode || event.button !== 0 || (event.target as HTMLElement).closest('button, input, select, a')) return;
                  pointerStart.current = { x: event.clientX, y: event.clientY };
                  clearLongPress();
                  longPressTimer.current = window.setTimeout(() => {
                    suppressNextClick.current = true;
                    onLongPress();
                    longPressTimer.current = null;
                  }, 550);
                };

                const handlePointerMove = (event: ReactPointerEvent<HTMLDivElement>) => {
                  if (!pointerStart.current || longPressTimer.current === null) return;
                  const distance = Math.hypot(event.clientX - pointerStart.current.x, event.clientY - pointerStart.current.y);
                  if (distance > 10) clearLongPress();
                };

                const handlePointerEnd = () => {
                  clearLongPress();
                  pointerStart.current = null;
                };

                return (
                  <div 
                    data-tour-id={tourId}
                    aria-pressed={isSelectionMode ? isSelected : undefined}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerEnd}
                    onPointerCancel={handlePointerEnd}
                    onPointerLeave={handlePointerEnd}
                    onContextMenu={event => { if (!isSelectionMode) event.preventDefault(); }}
                    onClick={(event) => {
                      if (suppressNextClick.current) {
                        suppressNextClick.current = false;
                        event.preventDefault();
                        return;
                      }
                      if (isSelectionMode) onToggleSelect();
                      else if (onEdit) onEdit();
                    }}
              ''').lstrip(),
          )

          regex_once(
              'src/components/AddTransactionModal.tsx',
              r'''          <div>\n            <label className="block text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-2">Event / outing \(optional\)</label>\n            <input\n.*?          </div>\n          \n          \{editingTransaction \? null : \(''',
              dedent('''
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-2">Event / outing (optional)</label>
                            <div className="grid gap-2 sm:grid-cols-2">
                              <select
                                aria-label="Choose existing event"
                                value={events.find(event => event.name.localeCompare(groupId.trim(), undefined, { sensitivity: 'accent' }) === 0)?.id ?? ''}
                                onChange={event => setGroupId(events.find(item => item.id === event.target.value)?.name ?? '')}
                                className="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low px-4 py-3 text-sm text-on-surface outline-none focus:border-primary/60"
                              >
                                <option value="">{events.length ? 'Choose existing event' : 'No existing events yet'}</option>
                                {events.map(event => <option key={event.id} value={event.id}>{event.name}</option>)}
                              </select>
                              <input
                                value={groupId}
                                onChange={event => setGroupId(event.target.value)}
                                placeholder="Or type a new event name"
                                className="w-full rounded-xl border border-outline-variant/30 bg-surface-container-low px-4 py-3 text-sm text-on-surface outline-none focus:border-primary/60"
                              />
                            </div>
                            <p className="mt-1.5 text-[11px] text-on-surface-variant">Selecting an existing event fills the name field; typing a different name creates a new event.</p>
                          </div>
                          
                          {editingTransaction ? null : (
              ''').lstrip(),
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit tested changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/implement-cycle-event-ux.yml
          git add -- src/context/AppContext.tsx src/components/Insights.tsx src/components/Activity.tsx src/components/AddTransactionModal.tsx src/utils/cycles.ts src/utils/cycles.test.ts
          git commit -m "fix: align insights cycles and improve event selection"
          git push origin HEAD:fix/event-insights-multi-select
