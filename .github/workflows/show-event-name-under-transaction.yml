name: Show transaction event name

on:
  push:
    branches:
      - fix/event-insights-multi-select
    paths:
      - .github/workflows/show-event-name-under-transaction.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add event label to transaction rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Activity.tsx')
          content = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global content
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              content = content.replace(old, new, 1)

          replace_once(
              "                  title={tx.title} \n                  subtitle={accountContext ? `${tx.subtitle} • ${accountContext}` : tx.subtitle} \n",
              "                  title={tx.title} \n                  eventName={events.find(event => event.id === tx.eventId)?.name}\n                  subtitle={accountContext ? `${tx.subtitle} • ${accountContext}` : tx.subtitle} \n",
          )

          replace_once(
              "  title: string;\n  subtitle: string;\n",
              "  title: string;\n  eventName?: string;\n  subtitle: string;\n",
          )

          replace_once(
              "function TransactionRow({ icon: Icon, title, subtitle, amount, tag, color, isIncome = false, isTransfer = false, isPending = false, type, onDelete, onEdit, isSelectionMode, isSelected, onToggleSelect, onLongPress, tourId }: TransactionRowProps) {\n",
              "function TransactionRow({ icon: Icon, title, eventName, subtitle, amount, tag, color, isIncome = false, isTransfer = false, isPending = false, type, onDelete, onEdit, isSelectionMode, isSelected, onToggleSelect, onLongPress, tourId }: TransactionRowProps) {\n",
          )

          replace_once(
              "        </div>\n        <p className=\"text-xs text-on-surface-variant break-words whitespace-pre-wrap mt-1\">\n          {subtitle} {type && <span className=\"capitalize opacity-80\">• {type}</span>}\n        </p>\n",
              "        </div>\n        {eventName && (\n          <p className=\"mt-1 flex items-center gap-1.5 text-xs font-medium text-primary break-words\">\n            <Layers className=\"h-3.5 w-3.5 shrink-0\" aria-hidden=\"true\" />\n            <span>{eventName}</span>\n          </p>\n        )}\n        <p className=\"text-xs text-on-surface-variant break-words whitespace-pre-wrap mt-1\">\n          {subtitle} {type && <span className=\"capitalize opacity-80\">• {type}</span>}\n        </p>\n",
          )

          path.write_text(content)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript against known baseline
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if [ "$status" -ne 0 ]; then
            errors=$(grep 'error TS' /tmp/tsc.log || true)
            unexpected=$(printf '%s\n' "$errors" \
              | grep -vFx "src/components/BackupSecurity.tsx(439,15): error TS2339: Property 'payload' does not exist on type 'String'." \
              | grep -vFx "src/components/BackupSecurity.tsx(439,33): error TS2339: Property 'legacy' does not exist on type 'String'." \
              || true)
            error_count=$(printf '%s\n' "$errors" | grep -c 'error TS' || true)
            if [ "$error_count" -ne 2 ] || [ -n "$unexpected" ]; then
              echo "Unexpected TypeScript errors were introduced."
              printf '%s\n' "$unexpected"
              exit 1
            fi
            echo "Only the two known pre-existing BackupSecurity.tsx errors remain."
          fi

      - name: Build production bundle
        run: npm run build

      - name: Commit and push source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/Activity.tsx
          git commit -m "fix: show event name under transactions"
          git push origin HEAD:fix/event-insights-multi-select
