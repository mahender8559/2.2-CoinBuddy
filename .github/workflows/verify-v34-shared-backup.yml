name: Verify v3.4 shared backup

on:
  push:
    branches:
      - feature/v3.4-shared-finances
    paths:
      - ci/run-v34-shared-backup.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-shared-finances
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v3.4 shared backup persistence
        run: |
          python3 scripts/apply_v34_backup_shared_tables.py
          python3 scripts/fix_v34_backup_expectation.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified backup changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/utils/ledgerSchema.ts src/db/dbClient.ts src/__tests__/ledgerImport.test.ts src/__tests__/sharedBackupV34.test.ts src/__tests__/backupManager.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Persist v3.4 shared finances in backups"
          git push origin HEAD:feature/v3.4-shared-finances
