name: Apply event grouping fix

on:
  push:
    branches:
      - fix/event-insights-multi-select

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select
      - name: Remove stale event-state validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/context/AppContext.tsx')
          content = path.read_text()
          stale_check = "    if (!events.some(event => event.id === eventId)) throw new Error('Selected event does not exist.');\n"
          if stale_check not in content:
              raise SystemExit('Expected stale event validation was not found.')
          path.write_text(content.replace(stale_check, '', 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/context/AppContext.tsx
          git commit -m "fix: group selected transactions into new events"
          git push origin HEAD:fix/event-insights-multi-select
