name: Scan monetary inputs

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - ci/scan-money-inputs.txt

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
      - name: Numeric inputs
        shell: bash
        run: |
          echo '=== input type=number occurrences ==='
          grep -R -n -C 4 'type="number"' src --include='*.tsx' || true
          echo '=== numeric parsing / amount state clues ==='
          grep -R -n -E -C 2 'setAmount|amount.*useState|Balance|budget|creditLimit|monthlyEMI|SIP|contingency|reserve' src/components --include='*.tsx' | head -n 1200 || true
