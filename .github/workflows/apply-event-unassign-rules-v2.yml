name: Apply event unassign and protection rules v2

on:
  push:
    branches:
      - fix/event-insights-multi-select
    paths:
      - .github/workflows/apply-event-unassign-rules-v2.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply event rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one literal match, found {count}: {old[:80]!r}')
              file_path.write_text(content.replace(old, new, 1))

          def replace_marked(path: str, start: str, end: str, replacement: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              start_index = content.find(start)
              if start_index < 0:
                  raise SystemExit(f'{path}: start marker not found: {start!r}')
              end_index = content.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{path}: end marker not found: {end!r}')
              end_index += len(end)
              if content.find(start, start_index + len(start)) >= 0:
                  raise SystemExit(f'{path}: start marker was not unique: {start!r}')
              file_path.write_text(content[:start_index] + replacement + content[end_index:])

          Path('src/domain/eventRules.ts').write_text(dedent('''
            import type { Transaction } from '../types';

            const EVENT_RESTRICTED_TRANSACTION_TYPES = new Set([
              'OPENING_BALANCE',
              'BALANCE_ADJUSTMENT',
              'MARKET_ADJUSTMENT',
            ]);

            export function isEventAssignableTransaction(
              transaction: Pick<Transaction, 'isOpeningBalance' | 'transaction_type'>,
            ): boolean {
              if (transaction.isOpeningBalance) return false;
              const transactionType = transaction.transaction_type?.toUpperCase();
              return !transactionType || !EVENT_RESTRICTED_TRANSACTION_TYPES.has(transactionType);
            }
          ''').lstrip())

          Path('src/domain/eventRules.test.ts').write_text(dedent('''
            import { describe, expect, it } from 'vitest';
            import { isEventAssignableTransaction } from './eventRules';

            describe('event assignment rules', () => {
              it('allows normal income, expense and transfer transactions', () => {
                expect(isEventAssignableTransaction({ transaction_type: 'EXPENSE' })).toBe(true);
                expect(isEventAssignableTransaction({ transaction_type: 'INCOME' })).toBe(true);
                expect(isEventAssignableTransaction({ transaction_type: 'TRANSFER' })).toBe(true);
              });

              it('blocks opening balances identified by their flag', () => {
                expect(isEventAssignableTransaction({ isOpeningBalance: true, transaction_type: 'INCOME' })).toBe(false);
              });

              it('blocks opening balances identified by transaction type', () => {
                expect(isEventAssignableTransaction({ transaction_type: 'OPENING_BALANCE' })).toBe(false);
              });

              it('blocks reconciliation balance adjustments', () => {
                expect(isEventAssignableTransaction({ transaction_type: 'BALANCE_ADJUSTMENT' })).toBe(false);
              });

              it('blocks market adjustments', () => {
                expect(isEventAssignableTransaction({ transaction_type: 'MARKET_ADJUSTMENT' })).toBe(false);
              });
            });
          ''').lstrip())

          replace_once(
              'src/context/AppContext.tsx',
              "import { getCycleDetailsForDay } from '../utils/cycles';\n",
              "import { getCycleDetailsForDay } from '../utils/cycles';\nimport { isEventAssignableTransaction } from '../domain/eventRules';\n",
          )
          replace_once(
              'src/context/AppContext.tsx',
              "  groupTransactionsToEvent: (transactionIds: string[], eventId: string) => void;\n",
              "  groupTransactionsToEvent: (transactionIds: string[], eventId: string | null) => void;\n",
          )
          replace_marked(
              'src/context/AppContext.tsx',
              '  const groupTransactionsToEvent = (transactionIds: string[], eventId: string) => {',
              '\n  };',
              dedent('''
                  const groupTransactionsToEvent = (transactionIds: string[], eventId: string | null) => {
                    const ids = transactionIds.filter(id => {
                      const transaction = transactions.find(item => item.id === id);
                      return Boolean(transaction && (eventId === null || isEventAssignableTransaction(transaction)));
                    });
                    if (!ids.length) return;
                    setTransactions(previous => previous.map(transaction =>
                      ids.includes(transaction.id) ? { ...transaction, eventId: eventId ?? undefined } : transaction
                    ));
                    if (dbDriver) persistDbAction(() => updateTransactionEvents(dbDriver, ids, eventId));
                  };
              ''').lstrip(),
          )

          replace_once(
              'src/db/dbClient.ts',
              'export async function updateTransactionEvents(driver: SqlJsDatabaseDriver, transactionIds: string[], eventId: string): Promise<void> {\n',
              'export async function updateTransactionEvents(driver: SqlJsDatabaseDriver, transactionIds: string[], eventId: string | null): Promise<void> {\n',
          )

          replace_once(
              'src/components/Activity.tsx',
              "import { isCashFlowTransaction } from '../domain/ledgerRules';\n",
              "import { isCashFlowTransaction } from '../domain/ledgerRules';\nimport { isEventAssignableTransaction } from '../domain/eventRules';\n",
          )
          replace_marked(
              'src/components/Activity.tsx',
              '  const selectedSum = useMemo(() => {',
              '\n  }, [selectedIds, transactions]);',
              dedent('''
                  const selectedTransactions = useMemo(
                    () => transactions.filter(transaction => selectedIds.has(transaction.id)),
                    [selectedIds, transactions]
                  );
                  const selectedSum = useMemo(() => {
                    return selectedTransactions.reduce((acc, t) => {
                      if (t.type === 'income' || t.type === 'transfer') return acc + Math.abs(t.amount);
                      return acc - Math.abs(t.amount);
                    }, 0);
                  }, [selectedTransactions]);
                  const hasEventRestrictedSelection = selectedTransactions.some(transaction => !isEventAssignableTransaction(transaction));
                  const hasAssignedEventSelection = selectedTransactions.some(transaction => Boolean(transaction.eventId));
              ''').lstrip(),
          )
          replace_marked(
              'src/components/Activity.tsx',
              'const openEventPicker = () => {',
              '\n\n\n  const availableCycles',
              dedent('''
                const resetEventSelection = () => {
                  setSelectedIds(new Set());
                  setIsSelectionMode(false);
                  setEventPickerOpen(false);
                  setEventName('');
                };

                const openEventPicker = () => {
                  if (!selectedIds.size || hasEventRestrictedSelection) return;
                  setEventName('');
                  setEventPickerOpen(true);
                };

                const groupSelectedToEvent = () => {
                  const name = eventName.trim();
                  if (!selectedIds.size || !name || hasEventRestrictedSelection) return;
                  const event = events.find(item => item.name.localeCompare(name, undefined, { sensitivity: 'accent' }) === 0) ?? createEvent(name);
                  groupTransactionsToEvent([...selectedIds], event.id);
                  resetEventSelection();
                };

                const unassignSelectedEvents = () => {
                  if (!selectedIds.size) return;
                  groupTransactionsToEvent([...selectedIds], null);
                  resetEventSelection();
                };


                  const availableCycles
              ''').lstrip(),
          )
          replace_once(
              'src/components/Activity.tsx',
              '''<div className="mt-5 flex justify-end gap-3">\n        <button type="button" onClick={() => setEventPickerOpen(false)} className="rounded-xl px-4 py-2 text-sm font-semibold text-on-surface-variant hover:bg-surface-variant">Cancel</button>\n        <button type="button" disabled={!eventName.trim()} onClick={groupSelectedToEvent} className="rounded-xl bg-primary px-4 py-2 text-sm font-bold text-on-primary disabled:opacity-50">Assign event</button>\n      </div>''',
              '''<div className="mt-5 flex flex-wrap items-center justify-between gap-3">\n        <div>\n          {hasAssignedEventSelection && (\n            <button type="button" onClick={unassignSelectedEvents} className="rounded-xl border border-error/30 px-4 py-2 text-sm font-semibold text-error hover:bg-error/10">Remove event</button>\n          )}\n        </div>\n        <div className="flex gap-3">\n          <button type="button" onClick={() => setEventPickerOpen(false)} className="rounded-xl px-4 py-2 text-sm font-semibold text-on-surface-variant hover:bg-surface-variant">Cancel</button>\n          <button type="button" disabled={!eventName.trim()} onClick={groupSelectedToEvent} className="rounded-xl bg-primary px-4 py-2 text-sm font-bold text-on-primary disabled:opacity-50">Assign event</button>\n        </div>\n      </div>''',
          )
          replace_once(
              'src/components/Activity.tsx',
              "              {selectedSum < 0 ? '-' : '+'}{formatCurrency(Math.abs(selectedSum))}\n            </p>\n",
              "              {selectedSum < 0 ? '-' : '+'}{formatCurrency(Math.abs(selectedSum))}\n            </p>\n            {hasEventRestrictedSelection && (\n              <p className=\"mt-1 max-w-[190px] text-[10px] leading-tight text-amber-600 dark:text-amber-300\">Opening balances and reconciliation adjustments cannot be assigned to an event.</p>\n            )}\n",
          )
          replace_once(
              'src/components/Activity.tsx',
              '''            <button \n              onClick={openEventPicker}\n              disabled={selectedIds.size === 0}\n              className="px-3 h-12 bg-primary/10 text-primary rounded-xl flex items-center gap-2 hover:bg-primary hover:text-on-primary transition-colors disabled:opacity-50 text-xs font-bold"\n              title="Group selected transactions to an event"\n              aria-label="Group selected transactions to event"\n            >''',
              '''            <button \n              onClick={openEventPicker}\n              disabled={selectedIds.size === 0 || hasEventRestrictedSelection}\n              className="px-3 h-12 bg-primary/10 text-primary rounded-xl flex items-center gap-2 hover:bg-primary hover:text-on-primary transition-colors disabled:opacity-50 text-xs font-bold"\n              title={hasEventRestrictedSelection ? 'Opening balances and reconciliation adjustments cannot be assigned to events' : 'Group selected transactions to an event'}\n              aria-label="Group selected transactions to event"\n            >''',
          )

          replace_once(
              'src/components/AddTransactionModal.tsx',
              '      <option value="">{events.length ? \'Choose existing event\' : \'No existing events yet\'}</option>\n',
              '      <option value="">No event (unassign)</option>\n',
          )
          replace_once(
              'src/components/AddTransactionModal.tsx',
              '''  <p className="mt-1.5 text-[11px] text-on-surface-variant">Selecting an existing event fills the name field; typing a different name creates a new event.</p>\n</div>''',
              '''  <div className="mt-2 flex flex-wrap items-center justify-between gap-2">\n    <p className="text-[11px] text-on-surface-variant">Selecting an existing event fills the name field; typing a different name creates a new event.</p>\n    {editingTransaction?.eventId && groupId && (\n      <button type="button" onClick={() => setGroupId('')} className="rounded-lg border border-error/30 px-3 py-1.5 text-xs font-semibold text-error hover:bg-error/10">Unassign event</button>\n    )}\n  </div>\n</div>''',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Check TypeScript against known baseline
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if [ "$status" -ne 0 ]; then
            errors=$(grep 'error TS' /tmp/tsc.log || true)
            unexpected=$(printf '%s\n' "$errors" \
              | grep -vFx "src/components/BackupSecurity.tsx(439,15): error TS2339: Property 'payload' does not exist on type 'String'." \
              | grep -vFx "src/components/BackupSecurity.tsx(439,33): error TS2339: Property 'legacy' does not exist on type 'String'." \
              || true)
            error_count=$(printf '%s\n' "$errors" | grep -c 'error TS' || true)
            if [ "$error_count" -ne 2 ] || [ -n "$unexpected" ]; then
              echo "Unexpected TypeScript errors were introduced."
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

      - name: Build production bundle
        run: npm run build

      - name: Commit and push source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/domain/eventRules.ts src/domain/eventRules.test.ts src/context/AppContext.tsx src/db/dbClient.ts src/components/Activity.tsx src/components/AddTransactionModal.tsx
          git commit -m "fix: support event unassignment and protect ledger adjustments"
          git push origin HEAD:fix/event-insights-multi-select
