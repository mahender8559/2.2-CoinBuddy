name: Fix v3.4 dependency vulnerabilities

on:
  push:
    branches:
      - feature/v3.4-shared-finances

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-shared-finances
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply narrow security overrides
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...(pkg.overrides || {}), nanoid: '3.3.17', uuid: '11.1.1' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only
      - name: Install locked dependencies
        run: npm ci
      - name: Require zero npm audit findings
        run: |
          npm audit --omit=dev
          npm audit
          npm ls nanoid uuid --all
      - name: Verify ExcelJS still creates XLSX data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import ExcelJS from 'exceljs';
          const workbook = new ExcelJS.Workbook();
          const sheet = workbook.addWorksheet('Security smoke');
          sheet.addRow(['CoinBuddy', 3.4]);
          const buffer = await workbook.xlsx.writeBuffer();
          if (!buffer || buffer.length < 100) throw new Error('ExcelJS XLSX smoke test failed');
          console.log(`ExcelJS smoke buffer: ${buffer.length} bytes`);
          NODE
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production and PWA build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Commit verified dependency fixes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve npm dependency vulnerabilities"
          git push origin HEAD:feature/v3.4-shared-finances
