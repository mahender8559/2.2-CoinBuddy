name: Verify planning persistence durability

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - ci/run-planning-persistence.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply persistence fix
        run: python3 scripts/apply_planning_persistence_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production and PWA build
        run: npm run build
      - name: Full desktop and mobile browser regression
        run: npm run test:e2e
      - name: Stress immediate planning persistence without retries
        run: npx playwright test e2e/affordability-phase7.spec.ts --grep "clean-ledger affordability setup survives reload|real Goals persist and feed affordability protection" --retries=0 --repeat-each=3
      - name: Commit verified persistence fix
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/context/AppContext.tsx src/components/AffordabilitySettings.tsx src/components/GoalsPanel.tsx
          if git diff --cached --quiet; then
            echo "No verified product changes to commit"
            exit 0
          fi
          git commit -m "Make planning settings and Goals saves durable"
          git push origin HEAD:feature/affordability-planner
