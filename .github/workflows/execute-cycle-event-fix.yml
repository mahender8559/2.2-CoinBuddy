name: Execute cycle and event fixes

on:
  push:
    branches:
      - fix/event-insights-multi-select

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/implement-cycle-event-ux.yml').read_text()
          marker_start = "          python - <<'PY'\n"
          marker_end = "          PY\n\n      - name: Install dependencies"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          script_lines = []
          for line in workflow[start:end].splitlines():
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-cycle-event-fix.py').write_text('\n'.join(script_lines) + '\n')
          PY
          python /tmp/apply-cycle-event-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript against known baseline
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if [ "$status" -ne 0 ]; then
            errors=$(grep 'error TS' /tmp/tsc.log || true)
            unexpected=$(printf '%s\n' "$errors" \
              | grep -vFx "src/components/BackupSecurity.tsx(439,15): error TS2339: Property 'payload' does not exist on type 'String'." \
              | grep -vFx "src/components/BackupSecurity.tsx(439,33): error TS2339: Property 'legacy' does not exist on type 'String'." \
              || true)
            error_count=$(printf '%s\n' "$errors" | grep -c 'error TS' || true)
            if [ "$error_count" -ne 2 ] || [ -n "$unexpected" ]; then
              echo "Unexpected TypeScript errors were introduced."
              printf '%s\n' "$unexpected"
              exit 1
            fi
            echo "Only the two known pre-existing BackupSecurity.tsx errors remain."
          fi

      - name: Build production bundle
        run: npm run build

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/context/AppContext.tsx src/components/Insights.tsx src/components/Activity.tsx src/components/AddTransactionModal.tsx src/utils/cycles.ts src/utils/cycles.test.ts
          git commit -m "fix: align insights cycles and improve event selection"
          git push origin HEAD:fix/event-insights-multi-select
