name: Verify normal living and card outstanding

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - ci/run-normal-living-card-outstanding.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply affordability updates
        run: |
          python3 scripts/apply_affordability_v31_followup.py
          python3 scripts/fix_normal_living_test_icons.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Browser regression
        run: npm run test:e2e
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Protect normal living costs and card outstanding"
          git push origin HEAD:feature/affordability-planner
