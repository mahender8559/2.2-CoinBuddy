name: Verify overdue affordability obligations

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - .github/workflows/fix-affordability-overdue.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Keep overdue pending recurring obligations in projections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/domain/affordability.ts')
          text = path.read_text(encoding='utf-8')
          old = "return Boolean(transaction.recurringRuleId || transaction.isRecurring) && dueDate >= asOfDate;"
          new = "return Boolean(transaction.recurringRuleId || transaction.isRecurring);"
          if text.count(old) != 1:
            raise RuntimeError(f'Expected one pending recurring condition, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('src/domain/affordability.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          marker = "  it('does not double-count a recurring occurrence already generated by the ledger', () => {"
          addition = """  it('keeps overdue pending recurring obligations in the projection until they are resolved', () => {\n    const result = run({\n      transactions: [tx({ id: 'overdue-rent', amount: 5000, date: '2026-08-10T12:00:00', dueDate: '2026-08-10', type: 'expense', transaction_type: 'EXPENSE', category: 'rent', account: 'bank', fromAccountId: 'bank', recurringRuleId: 'overdue-rule', isRecurring: true, is_verified: 0 })],\n    });\n    expect(result.expectedExpenses).toBe(5000);\n  });\n\n"""
          if tests.count(marker) != 1:
            raise RuntimeError(f'Expected one test marker, found {tests.count(marker)}')
          test_path.write_text(tests.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/domain/affordability.ts src/domain/affordability.test.ts
          git commit -m "Account for overdue pending recurring obligations"
          git push origin HEAD:feature/affordability-planner
