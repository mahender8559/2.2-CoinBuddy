name: Cleanup v3.4 development scaffolding

on:
  push:
    branches:
      - feature/v3.4-shared-finances
    paths:
      - ci/run-v34-cleanup.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-shared-finances
          fetch-depth: 0
      - name: Remove one-off v3.4 development scaffolding
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm -f .github/workflows/verify-v34-*.yml || true
          git rm -f scripts/*v34*.py || true
          git rm -f ci/run-v34-*.txt || true
          git rm -f .github/workflows/cleanup-v34-dev.yml || true
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "chore: remove v3.4 development scaffolding"
          git push origin HEAD:feature/v3.4-shared-finances
