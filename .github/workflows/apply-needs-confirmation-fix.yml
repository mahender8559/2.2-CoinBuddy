name: Apply recurring confirmation fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_needs_confirmation_fix.py
      - .github/workflows/apply-needs-confirmation-fix.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Narrow dashboard title replacement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_needs_confirmation_fix.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "text = replace_once(text, 'Pending Verifications', 'Needs confirmation', 'Dashboard section title')",
              "text = replace_once(text, '<h2 className=\"text-lg font-bold text-on-surface\">Pending Verifications</h2>', '<h2 className=\"text-lg font-bold text-on-surface\">Needs confirmation</h2>', 'Dashboard section title')",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply needs-confirmation fix
        run: python3 scripts/apply_needs_confirmation_fix.py

      - name: Complete recurring test fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/__tests__/recurringConfirmation.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("title: 'Rent', amount: 20000, date:", "title: 'Rent', subtitle: '', amount: 20000, date:")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix recurring Needs confirmation flow"
          git push origin HEAD:main
