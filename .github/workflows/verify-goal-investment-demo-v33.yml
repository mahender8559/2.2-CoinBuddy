name: Verify v3.3 Goal investment and demo data

on:
  push:
    branches:
      - feature/v3.3-planning-reliability
    paths:
      - ci/run-goal-investment-demo-v33.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.3-planning-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Goal investment and demo changes
        run: |
          python3 scripts/apply_goal_investment_demo_v33.py
          python3 scripts/fix_demo_v33_due.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production and PWA build
        run: npm run build
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add DemoData.json src
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Support investment-linked Goals and v3.3 demo data"
          git push origin HEAD:feature/v3.3-planning-reliability
