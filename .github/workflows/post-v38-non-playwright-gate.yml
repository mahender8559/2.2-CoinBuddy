name: Post-v3.8 non-Playwright gate

on:
  push:
    branches:
      - fix/post-v38-quality-hardening

permissions:
  contents: write

jobs:
  non-playwright-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply narrow hardening fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/context/AppContext.tsx')
          text = app.read_text()
          old = "const onPersistenceWarning = (event: Event) => {"
          new = "const onPersistenceWarning: EventListener = (event) => {"
          if old not in text and new not in text:
              raise SystemExit('AppContext persistence warning handler pattern not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          test = Path('src/utils/backupSession.test.ts')
          text = test.read_text()
          old = "    const migrated = await migrateLegacyBackupSettings({ hasPassword: true, backupPassword: 'legacy-secret' });"
          new = "    const legacySettings: { hasPassword: boolean; backupPassword?: string; backupPasswordVerifier?: string } = { hasPassword: true, backupPassword: 'legacy-secret' };\n    const migrated = await migrateLegacyBackupSettings(legacySettings);"
          if old not in text and new not in text:
              raise SystemExit('backupSession legacy fixture pattern not found')
          text = text.replace(old, new, 1)
          test.write_text(text)

          goals_test = Path('src/domain/savingsGoals.test.ts')
          text = goals_test.read_text()
          old = """    expect(goals).toHaveLength(1);\n    expect(goals[0].name).toBe('Laptop');"""
          new = """    expect(goals).toHaveLength(2);\n    expect(goals[0]).toMatchObject({ name: 'Savings goal', targetAmount: 0, monthlyContribution: 0, isActive: false });\n    expect(goals[1].name).toBe('Laptop');"""
          if old not in text and new not in text:
              raise SystemExit('savingsGoals malformed-goal assertion pattern not found')
          text = text.replace(old, new, 1)
          goals_test.write_text(text)
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/context/AppContext.tsx src/utils/backupSession.test.ts src/domain/savingsGoals.test.ts
            git commit -m "test: preserve malformed goals as disabled records"
            git push origin HEAD:fix/post-v38-quality-hardening
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Google Drive auth integration
        run: node scripts/verify-google-drive-auth.mjs
