name: Verify v3.4 personal spending

on:
  push:
    branches:
      - feature/v3.4-shared-finances
    paths:
      - ci/run-v34-personal-spending.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-shared-finances
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply responsibility-aware spending integration
        run: python3 scripts/apply_v34_personal_spending.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified spending changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/types.ts src/db/sqliteSchema.ts src/db/sharedFinanceRepository.ts src/db/dbClient.ts src/context/AppContext.tsx src/components/SharingPanel.tsx src/utils/budget.ts src/components/ManageFinances.tsx src/components/Dashboard.tsx src/domain/personalSpending.ts src/domain/personalSpending.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Make v3.4 spending responsibility-aware"
          git push origin HEAD:feature/v3.4-shared-finances
