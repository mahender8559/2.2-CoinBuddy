name: Post-v3.8 sync validation

on:
  push:
    branches:
      - fix/post-v38-quality-hardening
    paths-ignore:
      - .github/sync-validation-result.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-Playwright validation and record status
        shell: bash
        run: |
          set +e
          npm run lint
          typecheck=$?
          npm test
          vitest=$?
          npm run build
          build=$?
          node scripts/verify-google-drive-auth.mjs
          drive=$?
          set -e

          printf 'typecheck=%s\nvitest=%s\nbuild=%s\ngoogle_drive_auth=%s\n' "$typecheck" "$vitest" "$build" "$drive" > .github/sync-validation-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/sync-validation-result.txt
          git commit -m "test: record post-main-sync validation result" || true
          git push origin HEAD:fix/post-v38-quality-hardening

          if [ "$typecheck" -ne 0 ] || [ "$vitest" -ne 0 ] || [ "$build" -ne 0 ] || [ "$drive" -ne 0 ]; then
            exit 1
          fi
