name: Fix restore decrypt helper

on:
  push:
    branches:
      - fix/event-insights-multi-select
    paths:
      - .github/workflows/fix-restore-decrypt-helper.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-insights-multi-select

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix restore decrypt helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/BackupSecurity.tsx')
          content = path.read_text()

          replacements = [
              ('  decryptBackup, \n', '  decryptBackupWithFlag, \n'),
              ('const { payload: rawJson, legacy } = await decryptBackup(payloadToDecrypt, restorePassword);',
               'const { payload: rawJson, legacy } = await decryptBackupWithFlag(payloadToDecrypt, restorePassword);'),
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {count}')
              content = content.replace(old, new, 1)

          if 'decryptBackup(' in content:
              raise SystemExit('Unexpected decryptBackup call remains in BackupSecurity.tsx')
          if content.count('decryptBackupWithFlag') != 2:
              raise SystemExit('Expected one import and one call for decryptBackupWithFlag')

          path.write_text(content)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Commit and push source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/BackupSecurity.tsx
          git diff --cached --check
          git commit -m "fix: restore decrypted backups with metadata"
          git push origin HEAD:fix/event-insights-multi-select
