name: Verify v3.4 final product

on:
  push:
    branches:
      - feature/v3.4-shared-finances
    paths:
      - ci/run-v34-final-product.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-shared-finances
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final v3.4 product patch
        run: python3 scripts/apply_v34_finish_product.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production and PWA build
        run: npm run build
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Commit verified v3.4 product
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add DemoData.json package.json package-lock.json src/db/sharedFinanceRepository.ts src/context/AppContext.tsx src/components/SharingPanel.tsx src/components/Insights.tsx src/components/Dashboard.tsx src/components/AffordabilityPlanner.tsx src/components/Settings.tsx src/domain/v34SharedFinal.test.ts src/__tests__/sharedBackupV34.test.ts e2e/demo-data-v33.spec.ts e2e/v34-shared-finances.spec.ts
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Finish CoinBuddy v3.4 shared finances"
          git push origin HEAD:feature/v3.4-shared-finances
