name: Verify affordability phase 6

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - .phase6-verify-trigger

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Phase 6
        run: python3 scripts/apply_affordability_phase6.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified Phase 6 source
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/components/AffordabilityPlanner.tsx src/components/AffordabilitySettings.tsx src/components/CategoryAffordabilityReview.tsx src/components/Insights.tsx src/components/ManageFinances.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add affordability planner experience"
          git push origin HEAD:feature/affordability-planner
