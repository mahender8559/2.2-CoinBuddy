name: Audit v3.4 dependencies

on:
  push:
    branches:
      - feature/v3.4-shared-finances

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Trace vulnerable packages
        shell: bash
        run: |
          npm ls nanoid uuid --all || true
      - name: Audit exact state
        shell: bash
        run: |
          set +e
          npm audit --omit=dev
          echo "PROD_AUDIT_EXIT=$?"
          exit 0
