name: Normalize and verify desktop layout

on:
  push:
    branches:
      - feature/v3.4-shared-finances

permissions:
  contents: write

jobs:
  normalize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.4-shared-finances
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply layout patch
        run: python scripts/normalize_layout.py
      - run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: TypeScript
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production/PWA build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-consistency-screenshots
          path: test-results/**/**-layout.png
          if-no-files-found: warn
      - name: Commit verified layout normalization
        if: success()
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/App.tsx src/components/Dashboard.tsx src/components/Activity.tsx src/components/ManageFinances.tsx src/components/Cards.tsx src/components/Settings.tsx src/components/Insights.tsx e2e/layout-consistency.spec.ts
          git diff --cached --quiet || git commit -m "fix: unify desktop page layout widths [skip ci]"
          git push origin HEAD:feature/v3.4-shared-finances
