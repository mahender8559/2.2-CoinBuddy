name: Apply affordability phase 1 and 2

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - scripts/apply_affordability_phase12.py
      - .github/workflows/apply-affordability-phase12.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply phase 1 and 2
        run: python3 scripts/apply_affordability_phase12.py

      - name: Fix typed icon fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'src/domain/affordability.ts': [("rule.icon ?? 'Wallet'", "rule.icon ?? 'ShoppingBag'")],
            'src/domain/affordability.test.ts': [("icon: 'Wallet'", "icon: 'ShoppingBag'")],
            'src/domain/categoryAffordability.test.ts': [("icon: 'Wrench'", "icon: 'Heart'")],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in text:
                raise RuntimeError(f'Missing expected fixture in {filename}: {old}')
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Implement affordability model and projection engine"
          git push origin HEAD:feature/affordability-planner
