name: Fix visible CoinBuddy version

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - .github/workflows/fix-visible-version.yml

permissions:
  contents: write

jobs:
  fix-version-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - name: Update Settings version label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Settings.tsx')
          text = path.read_text()
          old = 'Coin Buddy V3.0'
          new = 'Coin Buddy V3.1'
          if old not in text:
              raise SystemExit('Expected V3.0 Settings label was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit visible version label
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/components/Settings.tsx
          git commit -m "fix: show CoinBuddy v3.1 in Settings"
          git push origin HEAD:feature/affordability-planner
