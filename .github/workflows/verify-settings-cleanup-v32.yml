name: Verify settings cleanup v3.2

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - ci/run-settings-cleanup-v32.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply product changes
        run: |
          python3 scripts/apply_settings_cleanup_v32.py
          python3 scripts/fix_settings_cleanup_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production and PWA build
        run: npm run build

      - name: Browser regression
        run: npm run test:e2e

      - name: Settings hygiene checks
        shell: bash
        run: |
          if grep -R -n 'Auto-create recurring entries\|Load CoinBuddy Test Data\|Edit in Manage → Investment\|Wi-Fi Only\|<option value="CUSTOM">' src/components; then
            echo 'Found a retired or misleading Settings control.'
            exit 1
          fi

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src e2e/settings-cleanup.spec.ts
          if git diff --cached --quiet; then
            echo "No verified product changes to commit"
            exit 0
          fi
          git commit -m "Clean up Settings and expand integrity audit"
          git push origin HEAD:feature/affordability-planner
