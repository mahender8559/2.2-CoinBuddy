name: Verify v3.1 projection scheduling

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - ci/run-v31-projection-scheduling.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply fixes
        run: |
          python3 scripts/apply_v31_projection_and_scheduling_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/affordability-phase7.spec.ts')
          text = path.read_text()
          text = text.replace("page.getByRole('button', { name: 'Transfer', exact: true }).click()", "page.getByRole('button', { name: 'Transfer', exact: true }).first().click()", 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/components/AffordabilityPlanner.tsx src/components/AddTransactionModal.tsx src/context/AppContext.tsx src/components/Dashboard.tsx src/components/Activity.tsx e2e/affordability-phase7.spec.ts
          if git diff --cached --quiet; then
            echo "No verified source changes to commit"
            exit 0
          fi
          git commit -m "Fix affordability breakdown and scheduled transfer validation"
          git push origin HEAD:feature/affordability-planner
