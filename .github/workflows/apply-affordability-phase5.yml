name: Apply affordability phase 5

on:
  push:
    branches:
      - feature/affordability-planner
    paths:
      - scripts/apply_affordability_phase5.py
      - .github/workflows/apply-affordability-phase5.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/affordability-planner
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply phase 5
        run: python3 scripts/apply_affordability_phase5.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add src/domain/irregularSpending.ts src/domain/irregularSpending.test.ts src/domain/affordabilityPlanner.ts src/domain/affordabilityPlanner.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Estimate historical irregular spending"
          git push origin HEAD:feature/affordability-planner
